<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=844, height=390, initial-scale=1.0, user-scalable=no">
  <title>FalaMestre! — Academia de Jovens</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-navy: #00381a;
      --gold: #FFDF00;
      --green: #00A859;
      --cyan: #55e0a0;
      --card-bg: #004d23;
      --pitch-dark: #006600;
      --pitch-light: #008800;
      --blue-away: #3EA0D4;
      --red: #FF3333;
      --orange: #FFA500;
      --black: #000000;
      --muted-gold: rgba(255,223,0,0.55);
      --frosted-fill: rgba(0,18,8,0.72);
      --frosted-border: 1px solid rgba(255,223,0,0.30);
    }

    html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--black);
    }

    body {
      width: 844px;
      height: 390px;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      background: var(--bg-navy);
      color: var(--gold);
      position: relative;
      /* Center and scale to fit viewport */
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
    }

    /* CRT Scanlines */
    .crt-scanlines {
      position: absolute;
      top: 0; left: 0;
      width: 844px; height: 390px;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      z-index: 99;
      pointer-events: none;
    }

    /* CRT Vignette */
    .crt-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 844px; height: 390px;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      z-index: 98;
      pointer-events: none;
    }

    /* Phosphor border glow */
    .crt-phosphor {
      position: absolute;
      top: 0; left: 0;
      width: 844px; height: 390px;
      box-shadow: inset 0 0 0 2px rgba(255,223,0,0.35);
      z-index: 100;
      pointer-events: none;
    }

    /* Film grain */
    .crt-grain {
      position: absolute;
      top: 0; left: 0;
      width: 844px; height: 390px;
      z-index: 97;
      pointer-events: none;
      opacity: 0.04;
    }

    /* Flicker */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      48% { opacity: 1; }
      50% { opacity: 0.97; }
      52% { opacity: 0.94; }
      54% { opacity: 1; }
    }

    .screen-container {
      width: 844px;
      height: 390px;
      display: flex;
      flex-direction: row;
      animation: flicker 6s infinite;
      position: relative;
      overflow: hidden;
    }

    /* === LEFT PANEL: Header + Tabs + Discover === */
    .left-panel {
      width: 280px;
      height: 390px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 10px 12px;
      border-right: 1px solid rgba(255,223,0,0.15);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 7px;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold), 0 0 22px rgba(255,215,0,0.5);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    .header-sub {
      font-size: 5px;
      color: var(--cyan);
      margin-top: 5px;
      letter-spacing: 0.3px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex-shrink: 0;
      height: 30px;
      margin-bottom: 8px;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 4.5px;
      height: 30px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid var(--gold);
      background: transparent;
      color: var(--gold);
      white-space: nowrap;
    }

    .tab:first-child {
      border-radius: 5px 0 0 5px;
    }

    .tab:last-child {
      border-radius: 0 5px 5px 0;
      border-left: none;
    }

    .tab.active {
      background: var(--gold);
      color: var(--bg-navy);
    }

    .tab:not(.active):hover {
      background: rgba(255,223,0,0.1);
    }

    /* Discover Button */
    .discover-area {
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .discover-btn {
      width: 100%;
      height: 38px;
      border: 2px dashed var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: 'Press Start 2P', monospace;
      font-size: 4.5px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      line-height: 1.3;
    }

    .discover-btn:hover {
      background: rgba(255,223,0,0.08);
      text-shadow: 0 0 10px var(--gold), 0 0 22px rgba(255,215,0,0.5);
    }

    .discover-btn:active {
      background: rgba(255,223,0,0.15);
    }

    .discover-cost {
      text-align: center;
      font-size: 4px;
      color: var(--cyan);
      margin-top: 4px;
      font-family: 'Press Start 2P', monospace;
    }

    /* Stats summary in left panel */
    .stats-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 8px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--frosted-fill);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,223,0,0.15);
      border-radius: 5px;
    }

    .stat-label {
      font-size: 3.5px;
      color: var(--cyan);
    }

    .stat-value {
      font-size: 5px;
      color: var(--gold);
      text-shadow: 0 0 6px rgba(255,223,0,0.3);
    }

    /* === RIGHT PANEL: Players list === */
    .right-panel {
      flex: 1;
      height: 390px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-label {
      font-size: 4px;
      color: var(--muted-gold);
      padding: 8px 12px 4px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    /* Players List */
    .players-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 10px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,223,0,0.4) rgba(0,18,8,0.5);
    }

    .players-list::-webkit-scrollbar {
      width: 3px;
    }

    .players-list::-webkit-scrollbar-track {
      background: rgba(0,18,8,0.5);
      border-radius: 2px;
    }

    .players-list::-webkit-scrollbar-thumb {
      background: rgba(255,223,0,0.4);
      border-radius: 2px;
    }

    /* Player Card */
    .player-card {
      width: 100%;
      height: 68px;
      background: var(--frosted-fill);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,223,0,0.30);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      transition: border-color 0.2s;
    }

    .player-card:hover {
      border-color: rgba(255,223,0,0.55);
    }

    .player-card.highlighted {
      border: 2px solid var(--gold);
      box-shadow: 0 0 14px rgba(255,223,0,0.2);
      padding: 6px 9px;
    }

    /* Ready badge */
    .ready-badge {
      position: absolute;
      top: -1px;
      right: 10px;
      background: var(--bg-navy);
      border: 2px solid var(--gold);
      border-top: none;
      border-radius: 0 0 5px 5px;
      padding: 2px 5px 3px;
      font-size: 3px;
      color: var(--gold);
      text-shadow: 0 0 8px var(--gold), 0 0 16px rgba(255,215,0,0.5);
      animation: badgePulse 2s ease-in-out infinite;
      z-index: 2;
      font-family: 'Press Start 2P', monospace;
      white-space: nowrap;
    }

    @keyframes badgePulse {
      0%, 100% { text-shadow: 0 0 8px var(--gold), 0 0 16px rgba(255,215,0,0.5); }
      50% { text-shadow: 0 0 14px var(--gold), 0 0 28px rgba(255,215,0,0.7); }
    }

    /* Pixel Avatar */
    .pixel-avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      image-rendering: pixelated;
    }

    .pixel-avatar canvas {
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
    }

    /* Center info */
    .player-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-name {
      font-size: 5.5px;
      color: var(--gold);
      text-shadow: 0 0 6px rgba(255,223,0,0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Press Start 2P', monospace;
    }

    .player-meta {
      font-size: 3.5px;
      color: var(--cyan);
      letter-spacing: 0.3px;
      font-family: 'Press Start 2P', monospace;
    }

    .player-potential {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stars {
      font-size: 8px;
      line-height: 1;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
    }

    .star-filled {
      color: var(--gold);
      text-shadow: 0 0 4px rgba(255,223,0,0.4);
    }

    .star-empty {
      color: rgba(255,223,0,0.2);
    }

    .potential-label {
      font-size: 3px;
      color: var(--muted-gold);
      letter-spacing: 0.5px;
      font-family: 'Press Start 2P', monospace;
    }

    /* OVR bar */
    .ovr-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ovr-label {
      font-size: 3.5px;
      color: var(--cyan);
      white-space: nowrap;
      font-family: 'Press Start 2P', monospace;
    }

    .ovr-bar-track {
      flex: 1;
      height: 3px;
      background: rgba(255,223,0,0.1);
      border-radius: 2px;
      overflow: hidden;
      max-width: 80px;
    }

    .ovr-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width 0.5s ease;
      box-shadow: 0 0 4px rgba(0,168,89,0.5);
    }

    .ovr-value {
      font-size: 3px;
      color: var(--muted-gold);
      white-space: nowrap;
      font-family: 'Press Start 2P', monospace;
    }

    /* Right buttons */
    .player-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-train, .btn-promote {
      height: 24px;
      min-width: 68px;
      border-radius: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 3.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.2s;
      background: transparent;
    }

    .btn-train {
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
    }

    .btn-train:hover {
      background: var(--cyan);
      color: var(--bg-navy);
    }

    .btn-promote {
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-promote:hover:not(.dimmed) {
      background: var(--gold);
      color: var(--bg-navy);
    }

    .btn-promote.dimmed {
      border-color: rgba(255,223,0,0.25);
      color: rgba(255,223,0,0.25);
      cursor: not-allowed;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .empty-icon {
      font-size: 18px;
      opacity: 0.4;
    }

    .empty-title {
      font-size: 5px;
      color: var(--muted-gold);
      font-family: 'Press Start 2P', monospace;
    }

    .empty-sub {
      font-size: 3.5px;
      color: var(--cyan);
      font-family: 'Press Start 2P', monospace;
    }

    /* Tab content */
    .tab-content {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    /* Pitch stripe BG on right panel */
    .right-panel-bg {
      position: absolute;
      top: 0;
      left: 280px;
      width: 564px;
      height: 390px;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(
        0deg,
        var(--pitch-dark) 0px,
        var(--pitch-dark) 40px,
        var(--pitch-light) 40px,
        var(--pitch-light) 80px
      );
      opacity: 0.08;
    }

    /* Training animation */
    @keyframes trainPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .player-card.training {
      animation: trainPop 0.3s ease-out;
    }

    .player-card.training .ovr-bar-fill {
      box-shadow: 0 0 8px var(--green), 0 0 14px rgba(0,168,89,0.5);
    }
  </style>
</head>
<body>
  <!-- CRT Overlays -->
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>
  <div class="crt-phosphor"></div>
  <svg class="crt-grain" xmlns="http://www.w3.org/2000/svg" width="844" height="390">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    </filter>
    <rect width="844" height="390" filter="url(#grain)"/>
  </svg>

  <!-- Pitch stripe BG -->
  <div class="right-panel-bg"></div>

  <div class="screen-container">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="header">
        <div class="header-title">🌟 ACADEMIA DE JOVENS</div>
        <div class="header-sub">Descubra os talentos do futuro</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" data-tab="revelacoes">REVELAÇÕES</div>
        <div class="tab" data-tab="formacao">EM FORMAÇÃO</div>
      </div>

      <!-- Discover Button -->
      <div class="discover-area">
        <button class="discover-btn" id="discoverBtn">🔍 DESCOBRIR JOVEM TALENTO</button>
        <div class="discover-cost">💰 500</div>
      </div>

      <!-- Stats -->
      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-label">JOVENS</span>
          <span class="stat-value" id="statTotal">5</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">PRONTOS</span>
          <span class="stat-value" id="statReady">1</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">MÉDIA OVR</span>
          <span class="stat-value" id="statAvg">55</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">CRÉDITOS</span>
          <span class="stat-value" id="statCredits">2500</span>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <!-- Tab: Revelações -->
      <div class="tab-content active" id="tab-revelacoes">
        <div class="panel-label">▸ REVELAÇÕES — JOVENS TALENTOS</div>
        <div class="players-list" id="playersList"></div>
      </div>

      <!-- Tab: Em Formação -->
      <div class="tab-content" id="tab-formacao">
        <div class="empty-state">
          <div class="empty-icon">⭐</div>
          <div class="empty-title">NENHUM JOVEM EM FORMAÇÃO</div>
          <div class="empty-sub">CLIQUE ACIMA PARA DESCOBRIR TALENTOS</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Scale body to fit viewport
    function scaleScreen() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const scaleX = sw / 844;
      const scaleY = sh / 390;
      const scale = Math.min(scaleX, scaleY);
      document.body.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    scaleScreen();
    window.addEventListener('resize', scaleScreen);

    let credits = 2500;

    const players = [
      { name: "M. ELIAS", age: 17, position: "ATACANTE", stars: 4, ovr: 62, potential: "high", ready: false, jersey: "#FFDF00" },
      { name: "L. YAGO", age: 16, position: "PONTA DIREITA", stars: 5, ovr: 71, potential: "high", ready: true, jersey: "#FFDF00" },
      { name: "R. CARDOSO", age: 18, position: "MEIO-CAMPO", stars: 3, ovr: 55, potential: "medium", jersey: "#55e0a0" },
      { name: "P. SILVA", age: 17, position: "ZAGUEIRO", stars: 3, ovr: 48, potential: "medium", jersey: "#55e0a0" },
      { name: "D. COSTA", age: 19, position: "GOLEIRO", stars: 2, ovr: 42, potential: "low", jersey: "rgba(255,223,0,0.35)" },
    ];

    const namePool = [
      "A. NERES", "F. MENDES", "G. RAMOS", "T. ARAUJO", "B. HENRIQUE",
      "J. FELIX", "V. SOUZA", "H. MOURA", "K. TEIXEIRA", "C. MARTINS"
    ];
    const posPool = ["ATACANTE","PONTA DIREITA","PONTA ESQUERDA","MEIO-CAMPO","ZAGUEIRO","GOLEIRO","LATERAL"];

    function drawPixelAvatar(canvas, color) {
      const ctx = canvas.getContext('2d');
      canvas.width = 10;
      canvas.height = 10;
      ctx.imageSmoothingEnabled = false;

      // Head
      ctx.fillStyle = '#EDCBA0';
      ctx.fillRect(3, 0, 4, 3);
      // Hair
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(3, 0, 4, 1);
      // Eyes
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(4, 1, 1, 1);
      ctx.fillRect(6, 1, 1, 1);
      // Jersey
      ctx.fillStyle = color;
      ctx.fillRect(2, 3, 6, 4);
      // Number
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(4, 4, 2, 2);
      // Shorts
      ctx.fillStyle = '#1a1a3a';
      ctx.fillRect(3, 7, 2, 2);
      ctx.fillRect(6, 7, 2, 2);
      // Legs
      ctx.fillStyle = '#EDCBA0';
      ctx.fillRect(3, 7, 1, 1);
      ctx.fillRect(6, 7, 1, 1);
      // Shoes
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(3, 9, 2, 1);
      ctx.fillRect(6, 9, 2, 1);
    }

    function createStars(count) {
      let html = '<div class="stars">';
      for (let i = 0; i < 5; i++) {
        html += `<span class="${i < count ? 'star-filled' : 'star-empty'}">★</span>`;
      }
      html += '</div>';
      return html;
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = players.length;
      document.getElementById('statReady').textContent = players.filter(p => p.ready).length;
      const avg = players.length ? Math.round(players.reduce((s,p) => s + p.ovr, 0) / players.length) : 0;
      document.getElementById('statAvg').textContent = avg;
      document.getElementById('statCredits').textContent = credits;
    }

    function renderPlayers() {
      const list = document.getElementById('playersList');
      list.innerHTML = '';

      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card${p.ready ? ' highlighted' : ''}`;
        card.id = `card-${idx}`;

        const canvasId = `avatar-${idx}`;

        card.innerHTML = `
          ${p.ready ? '<div class="ready-badge">⚡ PRONTO PARA PROMOVER</div>' : ''}
          <div class="pixel-avatar">
            <canvas id="${canvasId}"></canvas>
          </div>
          <div class="player-info">
            <div class="player-name">${p.name}</div>
            <div class="player-meta">${p.age} ANOS · ${p.position}</div>
            <div class="player-potential">
              ${createStars(p.stars)}
              <span class="potential-label">POTENCIAL</span>
            </div>
            <div class="ovr-row">
              <span class="ovr-label">OVR ${p.ovr}</span>
              <div class="ovr-bar-track">
                <div class="ovr-bar-fill" style="width: ${p.ovr}%"></div>
              </div>
              <span class="ovr-value">${p.ovr}/100</span>
            </div>
          </div>
          <div class="player-actions">
            <button class="btn-train" onclick="trainPlayer(${idx})">🏋️ TREINAR</button>
            <button class="btn-promote ${!p.ready ? 'dimmed' : ''}" ${!p.ready ? 'disabled' : ''} onclick="promotePlayer(${idx})">⬆️ PROMOVER</button>
          </div>
        `;

        list.appendChild(card);
        const canvas = document.getElementById(canvasId);
        drawPixelAvatar(canvas, p.jersey);
      });

      updateStats();
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById(`tab-${target}`).classList.add('active');
      });
    });

    // Discover
    document.getElementById('discoverBtn').addEventListener('click', function() {
      if (credits < 500) return;
      credits -= 500;

      const btn = this;
      btn.style.borderColor = 'var(--green)';
      btn.style.color = 'var(--green)';
      btn.textContent = '✨ BUSCANDO...';
      btn.disabled = true;

      setTimeout(() => {
        btn.style.borderColor = '';
        btn.style.color = '';
        btn.textContent = '🔍 DESCOBRIR JOVEM TALENTO';
        btn.disabled = false;

        const stars = Math.random() < 0.15 ? 5 : Math.random() < 0.3 ? 4 : Math.random() < 0.6 ? 3 : 2;
        const ovr = stars * 10 + Math.floor(Math.random() * 12) + 5;
        const pot = stars >= 4 ? 'high' : stars === 3 ? 'medium' : 'low';
        const jersey = pot === 'high' ? '#FFDF00' : pot === 'medium' ? '#55e0a0' : 'rgba(255,223,0,0.35)';

        players.push({
          name: namePool[Math.floor(Math.random() * namePool.length)],
          age: 15 + Math.floor(Math.random() * 4),
          position: posPool[Math.floor(Math.random() * posPool.length)],
          stars, ovr: Math.min(ovr, 75), potential: pot, ready: false, jersey
        });

        renderPlayers();

        // Flash
        const flash = document.createElement('div');
        flash.style.cssText = 'position:absolute;top:0;left:0;width:844px;height:390px;background:rgba(255,223,0,0.08);z-index:95;pointer-events:none;';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 180);
      }, 1200);
    });

    window.trainPlayer = function(idx) {
      const p = players[idx];
      if (p.ovr >= 99) return;
      p.ovr = Math.min(99, p.ovr + Math.floor(Math.random() * 3) + 1);
      if (p.ovr >= 65 && p.stars >= 4) p.ready = true;

      renderPlayers();

      const card = document.getElementById(`card-${idx}`);
      if (card) {
        card.classList.add('training');
        setTimeout(() => card.classList.remove('training'), 350);
      }
    };

    window.promotePlayer = function(idx) {
      if (!players[idx].ready) return;
      players.splice(idx, 1);
      renderPlayers();

      const flash = document.createElement('div');
      flash.style.cssText = 'position:absolute;top:0;left:0;width:844px;height:390px;background:rgba(0,168,89,0.15);z-index:95;pointer-events:none;';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 250);
    };

    renderPlayers();
  </script>
</body>
</html>
