<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=844, height=390, initial-scale=1">
<title>New chat</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-navy: #00381a;
    --gold: #FFDF00;
    --green: #00A859;
    --cyan: #55e0a0;
    --card-bg: #004d23;
    --pitch-dark: #006600;
    --pitch-light: #008800;
    --blue: #3EA0D4;
    --red: #FF3333;
    --orange: #FFA500;
    --black: #000000;
    --muted-gold: rgba(255,223,0,0.55);
    --frost-bg: rgba(0,18,8,0.72);
    --frost-border: rgba(255,223,0,0.30);
    --modal-bg: rgba(0,18,8,0.96);
  }

  body {
    font-family: 'Press Start 2P', monospace;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* === CRT SCREEN CONTAINER === */
  .crt-screen {
    position: relative;
    width: 844px;
    height: 390px;
    background: var(--bg-navy);
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,56,26,0.5), 0 0 80px rgba(0,56,26,0.2);
  }

  /* Pitch background */
  .pitch-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: repeating-linear-gradient(
      to right,
      var(--pitch-dark) 0px,
      var(--pitch-dark) 105px,
      var(--pitch-light) 105px,
      var(--pitch-light) 210px
    );
    opacity: 0.35;
  }

  .pitch-lines {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .pitch-lines::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 10%;
    bottom: 10%;
    width: 1px;
    background: rgba(255,255,255,0.12);
  }

  .pitch-lines::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* SVG Grain Filter */
  .grain-filter {
    position: absolute;
    width: 0;
    height: 0;
  }

  .grain-overlay {
    position: absolute;
    inset: 0;
    z-index: 97;
    filter: url(#noiseFilter);
    opacity: 0.04;
    background: rgba(255,255,255,0.5);
    pointer-events: none;
  }

  /* Vignette */
  .crt-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    z-index: 98;
    pointer-events: none;
  }

  /* Scanlines */
  .crt-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    z-index: 99;
    pointer-events: none;
  }

  /* Phosphor border glow */
  .phosphor-glow {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 2px rgba(255,223,0,0.35);
    z-index: 100;
    pointer-events: none;
    border-radius: 6px;
  }

  /* CRT Flicker */
  @keyframes crtFlicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.97; }
    97% { opacity: 0.99; }
    98% { opacity: 0.96; }
  }

  .crt-screen {
    animation: crtFlicker 6s infinite;
  }

  /* === MODAL BACKDROP === */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    opacity: 0;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* === BOTTOM SHEET MODAL === */
  .bottom-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 85%;
    background: var(--modal-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 2px solid var(--gold);
    border-radius: 14px 14px 0 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }

  /* Modal scanlines */
  .bottom-sheet::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    border-radius: 14px 14px 0 0;
  }

  /* Drag Handle */
  .drag-handle {
    display: flex;
    justify-content: center;
    padding-top: 10px;
    padding-bottom: 6px;
    flex-shrink: 0;
  }

  .drag-handle-bar {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,223,0,0.40);
  }

  /* === SCROLLABLE CONTENT === */
  .modal-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,223,0,0.25) transparent;
  }

  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }

  .modal-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  .modal-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,223,0,0.25);
    border-radius: 2px;
  }

  /* === PLAYER HEADER === */
  .player-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 4px 0 14px;
    min-height: 80px;
  }

  /* Pixel Avatar */
  .avatar-block {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--cyan);
    image-rendering: pixelated;
  }

  .avatar-block canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .player-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .player-name {
    font-size: 7px;
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold), 0 0 22px rgba(255,215,0,0.5);
    line-height: 1.3;
    letter-spacing: 0.5px;
  }

  .player-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .position-pill {
    font-size: 5px;
    color: #fff;
    background: var(--cyan);
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    line-height: 1.4;
  }

  .nationality {
    font-size: 10px;
    line-height: 1;
  }

  .overall-badge {
    position: relative;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .diamond-shape {
    position: absolute;
    width: 26px;
    height: 26px;
    background: rgba(0,18,8,0.85);
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(255,223,0,0.3);
  }

  .overall-number {
    position: relative;
    z-index: 2;
    font-size: 8px;
    color: var(--gold);
    text-shadow: 0 0 6px rgba(255,223,0,0.6);
    font-family: 'Press Start 2P', monospace;
  }

  .player-age {
    font-size: 4px;
    color: var(--cyan);
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  /* === SEASON STATS === */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid rgba(255,223,0,0.25);
    border-bottom: 1px solid rgba(255,223,0,0.25);
    padding: 8px 0;
    margin-bottom: 10px;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .stat-value {
    font-size: 10px;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    text-shadow: 0 0 4px rgba(255,223,0,0.3);
  }

  .stat-label {
    font-size: 4px;
    color: var(--cyan);
    letter-spacing: 0.5px;
  }

  .stat-cards {
    font-size: 9px;
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .card-emoji {
    font-size: 6px;
  }

  /* === ATTRIBUTE BARS === */
  .attributes-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 8px;
  }

  .attr-row {
    display: flex;
    align-items: center;
    height: 22px;
    gap: 6px;
  }

  .attr-name {
    font-size: 5px;
    color: var(--cyan);
    width: 68px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
    text-align: right;
    line-height: 1;
  }

  .attr-bar-wrap {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .attr-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
  }

  .attr-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, transparent 60%);
    border-radius: 3px;
  }

  .attr-value {
    font-size: 5px;
    color: var(--gold);
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
  }

  .train-btn {
    width: 24px;
    height: 18px;
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 4px;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    line-height: 1;
  }

  .train-btn:hover {
    background: var(--gold);
    color: var(--bg-navy);
    box-shadow: 0 0 8px rgba(255,223,0,0.4);
  }

  .train-btn:active {
    transform: scale(0.93);
  }

  /* === MORALE & FITNESS === */
  .morale-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 6px;
  }

  .morale-row {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 18px;
  }

  .morale-label {
    font-size: 5px;
    color: var(--cyan);
    width: 68px;
    flex-shrink: 0;
    text-align: right;
    letter-spacing: 0.3px;
  }

  .morale-bar-wrap {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }

  .morale-bar-fill {
    height: 100%;
    border-radius: 4px;
    position: relative;
  }

  .morale-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, transparent 60%);
    border-radius: 4px;
  }

  .morale-value {
    font-size: 5px;
    color: var(--gold);
    width: 28px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
  }

  /* Training Cost */
  .training-cost {
    font-size: 4px;
    color: var(--muted-gold);
    text-align: center;
    padding: 4px 0 8px;
    letter-spacing: 0.3px;
  }

  /* === ACTION BUTTONS === */
  .action-row {
    display: flex;
    gap: 10px;
    padding: 0 0 4px;
    flex-shrink: 0;
  }

  .btn-action {
    flex: 1;
    height: 32px;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .btn-sell {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
  }

  .btn-sell:hover {
    background: var(--red);
    color: #fff;
    box-shadow: 0 0 12px rgba(255,51,51,0.4);
  }

  .btn-close {
    background: rgba(255,223,0,0.10);
    border: 1px solid rgba(255,223,0,0.40);
    color: var(--gold);
  }

  .btn-close:hover {
    background: var(--gold);
    color: var(--bg-navy);
    box-shadow: 0 0 12px rgba(255,223,0,0.4);
  }

  .btn-action:active {
    transform: scale(0.96);
  }

  /* Ambient animation for bars */
  @keyframes barGrow {
    from { width: 0%; }
  }

  .attr-bar-fill, .morale-bar-fill {
    animation: barGrow 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  /* Glow pulse on overall badge */
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,223,0,0.3); }
    50% { box-shadow: 0 0 14px rgba(255,223,0,0.55); }
  }

  .diamond-shape {
    animation: glowPulse 3s ease-in-out infinite;
  }
</style>
</head>
<body>

<!-- SVG Noise Filter -->
<svg class="grain-filter">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<div class="crt-screen">
  <!-- Pitch Background -->
  <div class="pitch-bg"></div>
  <div class="pitch-lines"></div>

  <!-- CRT Grain -->
  <div class="grain-overlay"></div>

  <!-- Phosphor Glow -->
  <div class="phosphor-glow"></div>

  <!-- Modal Backdrop -->
  <div class="modal-backdrop"></div>

  <!-- Bottom Sheet Modal -->
  <div class="bottom-sheet">
    <!-- Drag Handle -->
    <div class="drag-handle">
      <div class="drag-handle-bar"></div>
    </div>

    <!-- Scrollable Content -->
    <div class="modal-scroll">
      <!-- Player Header -->
      <div class="player-header">
        <div class="avatar-block">
          <canvas id="avatarCanvas" width="56" height="56"></canvas>
        </div>
        <div class="player-info">
          <div class="player-name">ROBERTO NEYMAR</div>
          <div class="player-meta-row">
            <span class="position-pill">MEIA</span>
            <span class="nationality">🇧🇷</span>
            <span class="player-age">24 ANOS</span>
          </div>
        </div>
        <div class="header-right">
          <div class="overall-badge">
            <div class="diamond-shape"></div>
            <span class="overall-number">87</span>
          </div>
        </div>
      </div>

      <!-- Season Stats -->
      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-value">22</span>
          <span class="stat-label">JOGOS</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">8</span>
          <span class="stat-label">GOLS</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">5</span>
          <span class="stat-label">ASSIST</span>
        </div>
        <div class="stat-box">
          <div class="stat-cards">
            <span class="stat-value">2</span><span class="card-emoji">🟡</span>
            <span class="stat-value">0</span><span class="card-emoji">🟥</span>

          <span class="stat-label">CARTÕES</span>

      </div>

      <!-- Attribute Bars -->
      <div class="attributes-section">
        <div class="attr-row">
          <span class="attr-name">TÉCNICO</span>
          <div class="attr-bar-wrap">
            <div class="attr-bar-fill" style="width:82%; background: var(--green);"></div>
          </div>
          <span class="attr-value">82</span>
          <button class="train-btn" title="Treinar Técnico">+</button>
        </div>
        <div class="attr-row">
          <span class="attr-name">FÍSICO</span>
          <div class="attr-bar-wrap">
            <div class="attr-bar-fill" style="width:78%; background: var(--blue);"></div>
          </div>
          <span class="attr-value">78</span>
          <button class="train-btn" title="Treinar Físico">+</button>
        </div>
        <div class="attr-row">
          <span class="attr-name">TÁTICO</span>
          <div class="attr-bar-wrap">
            <div class="attr-bar-fill" style="width:85%; background: var(--cyan);"></div>
          </div>
          <span class="attr-value">85</span>
          <button class="train-btn" title="Treinar Tático">+</button>
        </div>
        <div class="attr-row">
          <span class="attr-name">DESCANSO</span>
          <div class="attr-bar-wrap">
            <div class="attr-bar-fill" style="width:91%; background: var(--orange);"></div>
          </div>
          <span class="attr-value">91</span>
          <button class="train-btn" title="Treinar Descanso">+</button>
        </div>
      </div>

      <!-- Morale & Fitness -->
      <div class="morale-section">
        <div class="morale-row">
          <span class="morale-label">MORAL</span>
          <div class="morale-bar-wrap">
            <div class="morale-bar-fill" style="width:70%; background: linear-gradient(to right, var(--green), var(--gold));"></div>
          </div>
          <span class="morale-value">70</span>
        </div>
        <div class="morale-row">
          <span class="morale-label">PREPARO</span>
          <div class="morale-bar-wrap">
            <div class="morale-bar-fill" style="width:88%; background: var(--green);"></div>
          </div>
          <span class="morale-value">88%</span>
        </div>
      </div>

      <!-- Training Cost Hint -->
      <div class="training-cost">TREINAR CUSTA 💰 200 / SESSÃO</div>

      <!-- Action Buttons -->
      <div class="action-row">
        <button class="btn-action btn-sell">🔴 VENDER</button>
        <button class="btn-action btn-close" id="btnClose">✕ FECHAR</button>
      </div>
    </div>
  </div>
</div>

<script>
// === Pixel Art Avatar Generator ===
function drawPixelAvatar(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const s = 4; // pixel size

  ctx.imageSmoothingEnabled = false;

  // Background
  ctx.fillStyle = '#004d23';
  ctx.fillRect(0, 0, 56, 56);

  // Skin color
  const skin = '#D4956A';
  const hair = '#1A1A1A';
  const jersey = '#00A859';
  const jerseyDark = '#007A40';
  const shorts = '#FFFFFF';

  // Hair (top of head)
  ctx.fillStyle = hair;
  for (let x = 4; x <= 10; x++) { ctx.fillRect(x*s, 1*s, s, s); }
  for (let x = 3; x <= 11; x++) { ctx.fillRect(x*s, 2*s, s, s); }
  for (let x = 3; x <= 11; x++) { ctx.fillRect(x*s, 3*s, s, s); }

  // Face
  ctx.fillStyle = skin;
  for (let x = 4; x <= 10; x++) { ctx.fillRect(x*s, 4*s, s, s); }
  for (let x = 4; x <= 10; x++) { ctx.fillRect(x*s, 5*s, s, s); }
  for (let x = 4; x <= 10; x++) { ctx.fillRect(x*s, 6*s, s, s); }
  for (let x = 5; x <= 9; x++) { ctx.fillRect(x*s, 7*s, s, s); }

  // Eyes
  ctx.fillStyle = '#1A1A1A';
  ctx.fillRect(5*s, 5*s, s, s);
  ctx.fillRect(9*s, 5*s, s, s);

  // Mouth
  ctx.fillStyle = '#C0755A';
  ctx.fillRect(6*s, 7*s, s, s);
  ctx.fillRect(7*s, 7*s, s, s);
  ctx.fillRect(8*s, 7*s, s, s);

  // Jersey body
  ctx.fillStyle = jersey;
  for (let y = 8; y <= 11; y++) {
    for (let x = 3; x <= 11; x++) {
      ctx.fillRect(x*s, y*s, s, s);
    }
  }
  // Jersey dark stripe
  ctx.fillStyle = jerseyDark;
  for (let y = 8; y <= 11; y++) {
    ctx.fillRect(7*s, y*s, s, s);
  }

  // Arms (skin)
  ctx.fillStyle = skin;
  for (let y = 8; y <= 10; y++) {
    ctx.fillRect(2*s, y*s, s, s);
    ctx.fillRect(12*s, y*s, s, s);
  }

  // Jersey number "10"
  ctx.fillStyle = '#FFDF00';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('10', 7*s + 2, 11*s);

  // Shorts
  ctx.fillStyle = shorts;
  for (let x = 4; x <= 10; x++) {
    ctx.fillRect(x*s, 12*s, s, s);
  }
  for (let x = 4; x <= 6; x++) { ctx.fillRect(x*s, 13*s, s, s); }
  for (let x = 8; x <= 10; x++) { ctx.fillRect(x*s, 13*s, s, s); }
}

drawPixelAvatar('avatarCanvas');

// === Button interactions ===
document.querySelectorAll('.train-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    this.style.background = 'var(--gold)';
    this.style.color = 'var(--bg-navy)';
    this.textContent = '✓';
    setTimeout(() => {
      this.style.background = 'transparent';
      this.style.color = 'var(--gold)';
      this.textContent = '+';
    }, 600);
  });
});

// Close button interaction
document.getElementById('btnClose').addEventListener('click', function() {
  const sheet = document.querySelector('.bottom-sheet');
  const backdrop = document.querySelector('.modal-backdrop');
  
  sheet.style.animation = 'none';
  sheet.offsetHeight;
  sheet.style.transition = 'transform 0.35s cubic-bezier(0.55, 0, 1, 0.45)';
  sheet.style.transform = 'translateY(100%)';
  
  backdrop.style.transition = 'opacity 0.3s ease';
  backdrop.style.opacity = '0';
  
  setTimeout(() => {
    sheet.style.transition = 'none';
    sheet.style.transform = 'translateY(100%)';
    sheet.style.animation = '';
    void sheet.offsetHeight;
    sheet.style.animation = 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';
    backdrop.style.transition = 'none';
    backdrop.style.opacity = '0';
    backdrop.style.animation = '';
    void backdrop.offsetHeight;
    backdrop.style.animation = 'fadeIn 0.3s ease forwards';
  }, 800);
});

// Sell button
document.querySelector('.btn-sell').addEventListener('click', function() {
  this.textContent = '⚠️ CONFIRMAR?';
  this.style.background = 'var(--red)';
  this.style.color = '#fff';
  setTimeout(() => {
    this.innerHTML = '🔴 VENDER';
    this.style.background = 'transparent';
    this.style.color = 'var(--red)';
  }, 1500);
});
</script>
</body>
