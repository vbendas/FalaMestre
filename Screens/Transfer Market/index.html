<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FalaMestre! - Mercado de Transferências</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-navy: #00381a;
      --gold: #FFDF00;
      --green: #00A859;
      --cyan: #55e0a0;
      --card-bg: #004d23;
      --blue-away: #3EA0D4;
      --red-danger: #FF3333;
      --orange-warn: #FFA500;
      --black: #000000;
      --muted-gold: rgba(255, 223, 0, 0.55);
      --frosted-fill: rgba(0, 18, 8, 0.72);
      --frosted-border: 1px solid rgba(255, 223, 0, 0.30);
      --font: 'Press Start 2P', monospace;
    }

    html, body {
      width: 844px;
      height: 390px;
      overflow: hidden;
      background: var(--black);
      font-family: var(--font);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      width: 844px;
      height: 390px;
      background: var(--bg-navy);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* CRT Scanlines */
    .crt-scanlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 4px
      );
      z-index: 99;
      pointer-events: none;
    }

    /* CRT Vignette */
    .crt-vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 98;
      pointer-events: none;
    }

    /* Phosphor border glow */
    .crt-phosphor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 0 2px rgba(255, 223, 0, 0.35);
      z-index: 100;
      pointer-events: none;
    }

    /* Film grain */
    .crt-grain {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 97;
      pointer-events: none;
      opacity: 0.04;
    }

    .crt-grain svg {
      width: 100%;
      height: 100%;
    }

    /* Flicker */
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.96; }
      97% { opacity: 0.99; }
      98% { opacity: 0.94; }
    }

    .screen {
      animation: flicker 6s infinite;
    }

    /* Glow text utility */
    .glow {
      text-shadow: 0 0 10px #FFDF00, 0 0 22px rgba(255, 215, 0, 0.5);
    }

    .glow-subtle {
      text-shadow: 0 0 6px rgba(255, 223, 0, 0.4), 0 0 14px rgba(255, 215, 0, 0.25);
    }

    /* ========== HEADER ========== */
    .header {
      height: 60px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 16px 4px;
      position: relative;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0, 56, 26, 1) 0%, rgba(0, 56, 26, 0.95) 100%);
      border-bottom: 1px solid rgba(255, 223, 0, 0.15);
    }

    .header-title {
      font-size: 7px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .budget-pill {
      background: var(--frosted-fill);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: var(--frosted-border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 5px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ========== TAB ROW ========== */
    .tab-row {
      height: 32px;
      min-height: 32px;
      display: flex;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 223, 0, 0.2);
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 5px;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s;
      position: relative;
    }

    .tab.active {
      background: var(--gold);
      color: var(--bg-navy);
      border-bottom: 2px solid var(--gold);
    }

    .tab.inactive {
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(255, 223, 0, 0.3);
      border-bottom: 2px solid transparent;
    }

    .tab.inactive:hover {
      background: rgba(255, 223, 0, 0.08);
    }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      z-index: 10;
    }

    /* ========== LEFT: SEARCH & FILTERS ========== */
    .left-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-filter {
      padding: 8px 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-bar {
      width: 100%;
      height: 30px;
      display: flex;
      align-items: center;
      background: rgba(255, 223, 0, 0.08);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 0 10px;
      gap: 8px;
    }

    .search-bar .icon {
      font-size: 8px;
      filter: drop-shadow(0 0 4px rgba(255, 223, 0, 0.5));
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 5px;
      color: var(--gold);
      caret-color: var(--gold);
    }

    .search-bar input::placeholder {
      color: var(--muted-gold);
    }

    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      font-family: var(--font);
      font-size: 4px;
      height: 20px;
      padding: 0 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border: 1px solid var(--gold);
      flex-shrink: 0;
    }

    .chip.active {
      background: var(--gold);
      color: var(--bg-navy);
    }

    .chip.inactive {
      background: transparent;
      color: var(--gold);
    }

    .chip.inactive:hover {
      background: rgba(255, 223, 0, 0.12);
    }

    /* ========== PLAYER LIST ========== */
    .player-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-list::-webkit-scrollbar {
      width: 3px;
    }

    .player-list::-webkit-scrollbar-track {
      background: rgba(0, 18, 8, 0.5);
    }

    .player-list::-webkit-scrollbar-thumb {
      background: rgba(255, 223, 0, 0.3);
      border-radius: 2px;
    }

    .player-card {
      min-height: 58px;
      background: var(--frosted-fill);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 223, 0, 0.30);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      transition: all 0.25s;
      flex-shrink: 0;
    }

    .player-card:hover {
      border-color: rgba(255, 223, 0, 0.55);
      background: rgba(0, 18, 8, 0.6);
    }

    .player-card.highlight {
      background: rgba(255, 223, 0, 0.08);
      border: 1px solid rgba(255, 223, 0, 0.6);
      box-shadow: 0 0 18px rgba(255, 223, 0, 0.15), inset 0 0 30px rgba(255, 223, 0, 0.04);
    }

    .highlight-badge {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 3px;
      color: var(--gold);
      letter-spacing: 0.5px;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 6px rgba(255, 223, 0, 0.6); opacity: 1; }
      50% { text-shadow: 0 0 14px rgba(255, 223, 0, 0.9); opacity: 0.85; }
    }

    .pos-badge {
      min-width: 22px;
      height: 20px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 4px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }

    .pos-mei { background: #0e8a6a; }
    .pos-ata { background: var(--red-danger); }
    .pos-zag { background: var(--blue-away); }
    .pos-gol { background: #b8960c; }
    .pos-lat { background: var(--orange-warn); }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .player-name {
      font-size: 5px;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-age {
      font-size: 4px;
      color: var(--cyan);
    }

    .player-rating {
      font-size: 4px;
      color: var(--gold);
    }

    .player-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .player-price {
      font-size: 5px;
      color: var(--gold);
    }

    .btn-buy {
      font-family: var(--font);
      font-size: 4px;
      color: var(--gold);
      background: var(--bg-navy);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 4px 12px;
      height: 22px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-buy:hover {
      background: var(--gold);
      color: var(--bg-navy);
    }

    .load-more {
      text-align: center;
      padding: 8px 0 4px;
      font-size: 4px;
      color: var(--muted-gold);
      cursor: pointer;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .load-more:hover {
      color: var(--gold);
    }

    /* Background pitch stripes */
    .pitch-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg,
        #003d1b 0px,
        #003d1b 40px,
        #004520 40px,
        #004520 80px
      );
      opacity: 0.35;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Pitch background stripes -->
    <div class="pitch-bg"></div>

    <!-- CRT Effects -->
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
    <div class="crt-phosphor"></div>
    <div class="crt-grain">
      <svg>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#grain)"/>
      </svg>
    </div>

    <!-- Content -->
    <div class="content-wrapper">
      <!-- Header -->
      <div class="header">
        <div class="header-title glow">🏪 MERCADO DE TRANSFERÊNCIAS</div>
        <div class="budget-pill glow-subtle">💰 12.500 DISPONÍVEIS</div>
      </div>

      <!-- Tab Row -->
      <div class="tab-row">
        <button class="tab active" id="tab-disp">DISPONÍVEIS</button>
        <button class="tab inactive" id="tab-elenco">MEU ELENCO</button>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <div class="left-panel">
          <!-- Search & Filters -->
          <div class="search-filter">
            <div class="search-bar">
              <span class="icon">🔍</span>
              <input type="text" placeholder="BUSCAR JOGADOR...">
            </div>
            <div class="filter-row">
              <div class="chip active" data-filter="all">TODOS</div>
              <div class="chip inactive" data-filter="gol">GOL</div>
              <div class="chip inactive" data-filter="zag">ZAG</div>
              <div class="chip inactive" data-filter="lat">LAT</div>
              <div class="chip inactive" data-filter="mei">MEI</div>
              <div class="chip inactive" data-filter="ata">ATA</div>
            </div>
          </div>

          <!-- Player List -->
          <div class="player-list" id="playerList">
            <!-- Players injected by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const players = [
      { name: 'A. GABRIEL', pos: 'MEI', posClass: 'pos-mei', age: 24, rating: 81, price: '3.500', highlight: false },
      { name: 'R. CAMPOS', pos: 'LAT', posClass: 'pos-lat', age: 28, rating: 85, price: '5.200', highlight: true },
      { name: 'F. SANTOS', pos: 'GOL', posClass: 'pos-gol', age: 31, rating: 78, price: '2.100', highlight: false },
      { name: 'D. AZEVEDO', pos: 'ZAG', posClass: 'pos-zag', age: 26, rating: 79, price: '2.800', highlight: false },
      { name: 'M. RIBEIRO', pos: 'ATA', posClass: 'pos-ata', age: 22, rating: 83, price: '4.700', highlight: false },
      { name: 'L. PEREIRA', pos: 'MEI', posClass: 'pos-mei', age: 27, rating: 76, price: '1.900', highlight: false },
    ];

    const playerList = document.getElementById('playerList');

    function renderPlayers(filterPos = 'all') {
      playerList.innerHTML = '';
      const filtered = filterPos === 'all' ? players : players.filter(p => p.pos.toLowerCase() === filterPos);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = `player-card${p.highlight ? ' highlight' : ''}`;
        card.innerHTML = `
          ${p.highlight ? '<div class="highlight-badge glow">🔥 DESTAQUE</div>' : ''}
          <div class="pos-badge ${p.posClass}">${p.pos}</div>
          <div class="player-info">
            <div class="player-name glow-subtle">${p.name}</div>
            <div class="player-meta">
              <span class="player-age">${p.age} ANOS</span>
              <span class="player-rating">⭐ ${p.rating}</span>
            </div>
          </div>
          <div class="player-right">
            <div class="player-price glow-subtle">💰 ${p.price}</div>
            <button class="btn-buy" onclick="buyPlayer('${p.name}', ${p.price.replace('.', '')})">COMPRAR</button>
          </div>
        `;
        playerList.appendChild(card);
      });

      const loadMore = document.createElement('div');
      loadMore.className = 'load-more';
      loadMore.textContent = 'VER MAIS JOGADORES ↓';
      loadMore.addEventListener('click', () => {
        loadMore.textContent = 'CARREGANDO...';
        setTimeout(() => { loadMore.textContent = 'SEM MAIS JOGADORES'; }, 1200);
      });
      playerList.appendChild(loadMore);
    }

    // Filter chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active');
          c.classList.add('inactive');
        });
        chip.classList.remove('inactive');
        chip.classList.add('active');
        renderPlayers(chip.dataset.filter);
      });
    });

    // Tab switching
    const tabDisp = document.getElementById('tab-disp');
    const tabElenco = document.getElementById('tab-elenco');

    tabDisp.addEventListener('click', () => {
      tabDisp.className = 'tab active';
      tabElenco.className = 'tab inactive';
      document.querySelector('.search-filter').style.display = 'flex';
      renderPlayers();
    });

    tabElenco.addEventListener('click', () => {
      tabElenco.className = 'tab active';
      tabDisp.className = 'tab inactive';
      document.querySelector('.search-filter').style.display = 'flex';
      playerList.innerHTML = '<div style="text-align:center;padding:40px 0;font-size:5px;color:rgba(255,223,0,0.55);font-family:var(--font);">ELENCO VAZIO<br><br><span style="font-size:4px;color:#55e0a0;">COMPRE JOGADORES NO MERCADO</span></div>';
    });

    // Search
    document.querySelector('.search-bar input').addEventListener('input', (e) => {
      const query = e.target.value.toUpperCase();
      const activeFilter = document.querySelector('.chip.active').dataset.filter;
      const filtered = players.filter(p => {
        const matchPos = activeFilter === 'all' || p.pos.toLowerCase() === activeFilter;
        const matchName = p.name.includes(query);
        return matchPos && matchName;
      });

      playerList.innerHTML = '';
      if (filtered.length === 0) {
        playerList.innerHTML = '<div style="text-align:center;padding:30px 0;font-size:5px;color:rgba(255,223,0,0.55);font-family:var(--font);">NENHUM JOGADOR ENCONTRADO</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = `player-card${p.highlight ? ' highlight' : ''}`;
        card.innerHTML = `
          ${p.highlight ? '<div class="highlight-badge glow">🔥 DESTAQUE</div>' : ''}
          <div class="pos-badge ${p.posClass}">${p.pos}</div>
          <div class="player-info">
            <div class="player-name glow-subtle">${p.name}</div>
            <div class="player-meta">
              <span class="player-age">${p.age} ANOS</span>
              <span class="player-rating">⭐ ${p.rating}</span>
            </div>
          </div>
          <div class="player-right">
            <div class="player-price glow-subtle">💰 ${p.price}</div>
            <button class="btn-buy" onclick="buyPlayer('${p.name}', ${p.price.replace('.', '')})">COMPRAR</button>
          </div>
        `;
        playerList.appendChild(card);
      });
    });

    // Buy player
    let budget = 12500;

    function buyPlayer(name, price) {
      if (budget >= price) {
        budget -= price;
        const budgetPill = document.querySelector('.budget-pill');
        budgetPill.innerHTML = `💰 ${budget.toLocaleString('pt-BR')} DISPONÍVEIS`;

        // Flash effect
        const screen = document.querySelector('.screen');
        screen.style.boxShadow = 'inset 0 0 60px rgba(0, 168, 89, 0.4)';
        setTimeout(() => { screen.style.boxShadow = 'none'; }, 400);
      } else {
        const screen = document.querySelector('.screen');
        screen.style.boxShadow = 'inset 0 0 60px rgba(255, 51, 51, 0.4)';
        setTimeout(() => { screen.style.boxShadow = 'none'; }, 400);
      }
    }

    // Initial render
    renderPlayers();
  </script>
</body>
</html>
